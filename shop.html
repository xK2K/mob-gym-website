<head>

<body>

<!-- ── Navigation ── -->
<nav class="nav store-nav">
  <div class="nav__inner">
    <a class="nav__logo" href="index.html">
      <img src="images/logo-mark-gold.png" alt="THE MOB" class="nav__mark" />
      <span class="nav__wordmark">THE MOB</span>
    </a>
    <div class="nav__links">
      <a href="index.html" class="nav__link" data-en="Home" data-ar="الرئيسية">Home</a>
      <a href="shop.html" class="nav__link is-active" data-en="Store" data-ar="المتجر">Store</a>
    </div>
    <div class="nav__actions">
      <button class="nav__lang" id="langToggle" aria-label="Toggle language">AR</button>
      <button class="cart-trigger" id="cartOpen" aria-label="Open cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span data-en="Cart" data-ar="السلة">Cart</span>
        <span class="cart-badge" id="cartBadge"></span>
      </button>
    </div>
  </div>
</nav>

<!-- ── Hero ── -->
<section class="store-hero">
  <div class="store-hero__bg"></div>
  <p class="store-hero__kicker" data-en="Official MOB Gear" data-ar="معدات MOB الرسمية">Official MOB Gear</p>
  <h1 class="store-hero__title reveal" data-en="THE MOB<br>STORE" data-ar="متجر<br>THE MOB">THE MOB<br>STORE</h1>
  <p class="store-hero__sub reveal" data-en="Train in gear that hits different." data-ar="درّب بمعدات تفرق.">Train in gear that hits different.</p>
</section>

<!-- ── Filters ── -->
<div class="store-filter">
  <button class="filter-btn is-active" data-cat="all" data-en="All" data-ar="الكل">All</button>
  <button class="filter-btn" data-cat="gloves" data-en="Gloves" data-ar="قفازات">Gloves</button>
  <button class="filter-btn" data-cat="protection" data-en="Protection" data-ar="حماية">Protection</button>
  <button class="filter-btn" data-cat="apparel" data-en="Apparel" data-ar="ملابس">Apparel</button>
  <button class="filter-btn" data-cat="bags" data-en="Bags" data-ar="حقائب">Bags</button>
</div>

<!-- ── Products grid ── -->
<main class="store-grid" id="storeGrid">
  <!-- Populated by JS -->
</main>

<!-- ── Store footer ── -->
<footer class="store-footer">
  <p data-en="© 2025 THE MOB GYM. All rights reserved." data-ar="© 2025 THE MOB GYM. جميع الحقوق محفوظة.">© 2025 THE MOB GYM. All rights reserved.</p>
</footer>

<!-- ── Cart sidebar ── -->
<div class="cart-overlay" id="cartOverlay"></div>
<aside class="cart-panel" id="cartPanel" aria-label="Shopping cart">
  <div class="cart-panel__head">
    <h2 class="cart-panel__title" data-en="Your Cart" data-ar="سلتك">Your Cart</h2>
    <button class="cart-close" id="cartClose" aria-label="Close cart">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-panel__foot" id="cartFoot" hidden>
    <div class="cart-total">
      <span class="cart-total__label" data-en="Total" data-ar="المجموع">Total</span>
      <span class="cart-total__value" id="cartTotal">0 QAR</span>
    </div>
    <button class="cart-checkout-wa" id="cartWA">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      <span data-en="Order via WhatsApp" data-ar="اطلب عبر واتساب">Order via WhatsApp</span>
    </button>
    <p class="cart-pay-divider" data-en="— or pay online —" data-ar="— أو ادفع أونلاين —">— or pay online —</p>
    <div class="cart-pay-methods">
      <button class="pay-method-btn pay-method-btn--apple" id="payApple">
        <svg viewBox="0 0 24 24" fill="currentColor" height="18"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span>Apple Pay</span>
      </button>
      <button class="pay-method-btn" id="payShops">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" height="18"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
        <span data-en="Card / Shops" data-ar="بطاقة / شوبس">Card / Shops</span>
      </button>
    </div>
    <p class="pay-coming" data-en="Secure checkout powered by Shopify Payments &amp; Shops" data-ar="دفع آمن عبر Shopify Payments و Shops">Secure checkout powered by Shopify Payments &amp; Shops</p>
  </div>
</aside>

<script src="js/store.js"></script>
<script>
(function () {
  /* ── Language ── */
  var lang = localStorage.getItem('mob_lang') || 'en';
  function applyLang(l) {
    lang = l;
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    localStorage.setItem('mob_lang', l);
    document.getElementById('langToggle').textContent = l === 'ar' ? 'EN' : 'AR';
    document.querySelectorAll('[data-en]').forEach(function (el) {
      var key = l === 'ar' ? 'ar' : 'en';
      if (el.dataset[key]) el.innerHTML = el.dataset[key];
    });
    renderGrid();
    renderCart();
  }
  document.getElementById('langToggle').addEventListener('click', function () { applyLang(lang === 'ar' ? 'en' : 'ar'); });

  /* ── Product categories ── */
  var CAT_MAP = { gloves: 'gloves', headgear: 'protection', gi: 'apparel', bag: 'bags' };
  var activeCat = 'all';

  /* ── Render grid ── */
  function renderGrid() {
    var grid = document.getElementById('storeGrid');
    grid.innerHTML = '';
    PRODUCTS.forEach(function (p) {
      if (activeCat !== 'all' && CAT_MAP[p.id] !== activeCat) return;
      var badge = lang === 'ar' ? p.badgeAr : p.badge;
      var name = lang === 'ar' ? p.nameAr : p.nameEn;
      var sizeDots = p.sizes.slice(0, 4).map(function (s) {
        return '<span class="product-card__size-dot">' + s.replace(' oz','').replace(' Size','') + '</span>';
      }).join('');
      var card = document.createElement('a');
      card.href = 'product.html?id=' + p.id;
      card.className = 'product-card reveal';
      card.innerHTML =
        '<div class="product-card__img">' +
          (badge ? '<span class="product-card__badge">' + badge + '</span>' : '') +
          '<img src="' + p.image + '" alt="' + name + '" loading="lazy" onerror="this.style.opacity=0" />' +
        '</div>' +
        '<div class="product-card__body">' +
          '<span class="product-card__name">' + name + '</span>' +
          '<div class="product-card__sizes">' + sizeDots + '</div>' +
          '<span class="product-card__price">' + p.price + ' <small>QAR</small></span>' +
        '</div>';
      grid.appendChild(card);
    });
    /* trigger reveal */
    setTimeout(function () {
      grid.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
    }, 50);
  }

  /* ── Category filter ── */
  document.querySelectorAll('.filter-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.filter-btn').forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      activeCat = btn.dataset.cat;
      renderGrid();
    });
  });

  /* ── Cart panel ── */
  function renderCart() {
    var items = Cart.load();
    var itemsEl = document.getElementById('cartItems');
    var footEl = document.getElementById('cartFoot');
    var totalEl = document.getElementById('cartTotal');
    itemsEl.innerHTML = '';
    if (!items.length) {
      itemsEl.innerHTML =
        '<div class="cart-empty">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>' +
          '<p>' + (lang === 'ar' ? 'سلتك فاضية' : 'Your cart is empty') + '</p>' +
        '</div>';
      footEl.hidden = true;
      return;
    }
    footEl.hidden = false;
    totalEl.textContent = Cart.total() + ' QAR';
    items.forEach(function (item) {
      var name = lang === 'ar' ? item.nameAr : item.nameEn;
      var row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML =
        '<img class="cart-item__img" src="' + item.image + '" alt="' + name + '" onerror="this.style.opacity=0" />' +
        '<div>' +
          '<div class="cart-item__name">' + name + '</div>' +
          '<div class="cart-item__size">' + item.size + '</div>' +
          '<div class="cart-item__price">' + (item.price * item.qty) + ' QAR</div>' +
        '</div>' +
        '<div class="cart-item__controls">' +
          '<div class="qty-ctrl">' +
            '<button class="qty-btn" data-action="dec" data-id="' + item.id + '" data-size="' + item.size + '">−</button>' +
            '<span class="qty-val">' + item.qty + '</span>' +
            '<button class="qty-btn" data-action="inc" data-id="' + item.id + '" data-size="' + item.size + '">+</button>' +
          '</div>' +
          '<button class="cart-item__del" data-id="' + item.id + '" data-size="' + item.size + '">' + (lang === 'ar' ? 'حذف' : 'Remove') + '</button>' +
        '</div>';
      itemsEl.appendChild(row);
    });
    /* qty & remove listeners */
    itemsEl.querySelectorAll('.qty-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        Cart.changeQty(btn.dataset.id, btn.dataset.size, btn.dataset.action === 'inc' ? 1 : -1);
        renderCart();
      });
    });
    itemsEl.querySelectorAll('.cart-item__del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        Cart.remove(btn.dataset.id, btn.dataset.size);
        renderCart();
      });
    });
  }

  function openCart() {
    document.getElementById('cartPanel').classList.add('is-open');
    document.getElementById('cartOverlay').classList.add('is-open');
    renderCart();
  }
  function closeCart() {
    document.getElementById('cartPanel').classList.remove('is-open');
    document.getElementById('cartOverlay').classList.remove('is-open');
  }
  document.getElementById('cartOpen').addEventListener('click', openCart);
  document.getElementById('cartClose').addEventListener('click', closeCart);
  document.getElementById('cartOverlay').addEventListener('click', closeCart);

  /* ── WhatsApp order ── */
  document.getElementById('cartWA').addEventListener('click', function () {
    var msg = Cart.buildWAMessage(lang);
    if (!msg) return;
    window.open('https://wa.me/' + MOB_WA + '?text=' + msg, '_blank');
  });

  /* ── Payment stubs ── */
  function payNotReady(method) {
    alert(lang === 'ar'
      ? method + ' — قريباً! سيتم تفعيل الدفع الإلكتروني.'
      : method + ' — Coming soon! Online payment will be activated.');
  }
  document.getElementById('payApple').addEventListener('click', function () { payNotReady('Apple Pay'); });
  document.getElementById('payShops').addEventListener('click', function () { payNotReady('Shopify Payments / Card'); });

  /* ── Init ── */
  applyLang(lang);
})();
</script>
</body>
</html>
